name: ci

on:
  push:
  pull_request:

env:
  TZ: UTC

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e .
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q

  # End-to-end smoke: the full pipeline demo on the committed synthetic dataset
  # (< 90 s locally). The committed notebook is NOT executed in CI.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e .
      - name: Demo
        run: python -m milo.demo
