[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milo"
version = "0.1.0"
description = "Two-stage stochastic restock + pricing optimizer for a card-store consignment shelf (Pyomo GDP -> HiGHS), with demand estimation and a synthetic-data generator"
authors = [{ name = "Chase Baker", email = "chasebak@usc.edu" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=3.0",
    "scipy>=1.14",
    "pyomo==6.10.1",
    "highspy>=1.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "nbformat>=5.9", "matplotlib>=3.9", "nbclient>=0.10", "ipykernel>=6.29"]

[tool.setuptools]
packages = ["milo"]

[tool.ruff]
line-length = 125
# The walkthrough notebook is generated by tools/build_notebook.py and uses a compact
# notebook display style (chained set_option/axis calls); lint the generator, not the artifact.
extend-exclude = ["pricing_optimizer.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# the notebook builder embeds notebook cells as strings; a few cell lines run long
"tools/build_notebook.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
